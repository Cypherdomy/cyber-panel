<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CENTRAL_CORE_INTERFACE_v5.0</title>
    
    <!-- Open-Source-Karte -->
    <link rel="stylesheet" href="https://unpkg.com" />
    <script src="https://unpkg.com"></script>

    <style>
        body {
            background-color: #050505;
            color: #00ff33;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 10px;
            height: 100vh;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            text-shadow: 0 0 5px #00ff33;
            user-select: none;
            -webkit-user-select: none;
        }

        /* CRT Monitor Scanline-Effekt */
        body::before {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.2) 50%);
            z-index: 9999;
            background-size: 100% 4px;
            pointer-events: none;
        }

        header {
            border-bottom: 2px solid #00ff33;
            padding-bottom: 5px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            font-weight: bold;
            flex-shrink: 0;
        }

        /* Flexibles Layout für Desktop und Handy */
        .container {
            display: flex;
            flex-direction: row;
            gap: 15px;
            flex-grow: 1;
            height: calc(100vh - 50px);
        }

        /* Wenn es ein Handy ist, die Elemente untereinander anordnen */
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }
            .panel.left {
                height: 45% !important;
            }
            .panel.right {
                height: 55% !important;
            }
        }

        .panel {
            border: 1px solid #00ff33;
            background: rgba(0, 15, 0, 0.4);
            padding: 10px;
            box-shadow: inset 0 0 15px rgba(0, 255, 51, 0.15);
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
        }

        .panel.left { width: 100%; height: 100%; flex: 1; }
        .panel.right { width: 100%; height: 100%; flex: 2; position: relative; }

        .panel-title {
            font-weight: bold;
            text-transform: uppercase;
            border-bottom: 1px dashed #00ff33;
            padding-bottom: 3px;
            margin-bottom: 8px;
            font-size: 0.85rem;
            letter-spacing: 1px;
            flex-shrink: 0;
        }

        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            flex-shrink: 0;
        }

        button {
            background: #001a00;
            color: #00ff33;
            border: 1px solid #00ff33;
            padding: 10px 5px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            font-size: 0.75rem;
            text-transform: uppercase;
            transition: all 0.1s;
        }

        button:active {
            background: #00ff33;
            color: #000;
        }

        #terminal {
            flex-grow: 1;
            background: #000;
            padding: 8px;
            overflow-y: auto;
            font-size: 0.75rem;
            border: 1px solid #004400;
            margin-top: 10px;
        }

        /* Karten & Radar-Bereich */
        #map-container {
            width: 100%;
            height: 100%;
            position: relative;
            background: #000;
        }

        #map {
            width: 100%;
            height: 100%;
            position: absolute;
            top:0; left:0;
            z-index: 1;
        }

        /* Das visuelle Backup-Radar, falls die Karte offline blockiert wird */
        #offline-radar {
            width: 100%;
            height: 100%;
            position: absolute;
            top:0; left:0;
            z-index: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle, rgba(0,35,0,1) 0%, rgba(0,0,0,1) 70%);
            font-size: 0.9rem;
            animation: pulse 3s infinite;
        }

        .hacker-map {
            filter: invert(1) hue-rotate(80deg) saturate(2.5) brightness(0.4) contrast(1.5);
        }

        @keyframes pulse {
            0% { opacity: 0.7; }
            50% { opacity: 1; }
            100% { opacity: 0.7; }
        }
    </style>
</head>
<body>

    <header>
        <div>[NODE: MOBILE_GRID_READY]</div>
        <div id="live-clock">0000-00-00 00:00:00</div>
    </header>

    <div class="container">
        <!-- LINKES KONTROLLZENTRUM (OBEN AUF HANDY) -->
        <div class="panel left">
            <div class="panel-title">> INTERFACE_CONTROL</div>
            <div class="button-group">
                <button onclick="playHackerSound(500, 'sine', 0.08); scanGlobalSectors();">SCAN SENSORS</button>
                <button onclick="playHackerSound(350, 'sawtooth', 0.15); toggleRadarMode();">TOGGLE FREQ</button>
                <button onclick="playHackerSound(900, 'triangle', 0.05); simulateCameraFeed();">WEBCAM SEARCH</button>
                <button onclick="playHackerSound(600, 'square', 0.1); clearLogs();">CLEAR SYSTEM</button>
            </div>
            
            <div id="terminal">
                <div style="color: #666;">[SYSTEM] Mobil-Verschlüsselung aktiv.</div>
                <div style="color: #666;">[SYSTEM] Lade Karten-Kern...</div>
            </div>
        </div>

        <!-- RECHTES HAUPTDISPLAY (UNTEN AUF HANDY) -->
        <div class="panel right">
            <div class="panel-title">> LIVE_MATRIX_DISPLAY</div>
            <div id="map-container">
                <div id="offline-radar">// [GRID_LOCK] OFFLINE RADAR ACTIVE //</div>
                <div id="map"></div>
            </div>
        </div>
    </div>

    <script>
        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }

        function playHackerSound(frequency, type = 'square', duration = 0.1) {
            initAudio();
            if (!audioCtx) return;
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            oscillator.type = type; 
            oscillator.frequency.setValueAtTime(frequency, audioCtx.currentTime);
            gainNode.gain.setValueAtTime(0.08, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + duration);
        }

        setInterval(() => {
            const now = new Date();
            document.getElementById('live-clock').innerText = now.toISOString().replace('T', ' ').substring(0, 19);
        }, 1000);

        function logTerminal(message, type = 'info') {
            const terminal = document.getElementById('terminal');
            const timestamp = new Date().toLocaleTimeString();
            let color = '#00ff33';
            if (type === 'warn') color = '#ffb000';
            if (type === 'danger') color = '#ff0055';
            
            terminal.innerHTML += `<div><span style="color: #555;">[${timestamp}]</span> <span style="color: ${color};">${message}</span></div>`;
            terminal.scrollTop = terminal.scrollHeight;
        }

        function clearLogs() {
            document.getElementById('terminal').innerHTML = '<div style="color: #666;">[SYSTEM] Logs gelöscht. Protokoll bereinigt.</div>';
        }

        // INITIALISIERUNG DER KARTE MIT FEHLER-ABFANGUNG
        let map;
        let tileLayer;
        try {
            map = L.map('map', {
                zoomControl: false,
                attributionControl: false
            }).setView([20.0, 0.0], 1); 

            tileLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 18,
            }).addTo(map);

            L.DomUtil.addClass(tileLayer.getContainer(), 'hacker-map');
            
            setTimeout(() => {
                document.getElementById('offline-radar').style.display = 'none';
                logTerminal("ONLINE MAP: Weltkarte erfolgreich geladen.", "info");
            }, 1000);

        } catch(e) {
            document.getElementById('map').style.display = 'none';
            setTimeout(() => {
                logTerminal("LOCAL_MODE: Internetzugriff blockiert. Starte Offline-Vektor-Radar.", "warn");
            }, 500);
        }

        function scanGlobalSectors() {
            logTerminal("Analysiere Satelliten-Sektoren...", 'warn');
            if(map && document.getElementById('map').style.display !== 'none') {
                const lat = (Math.random() * 120) - 50;
                const lng = (Math.random() * 260) - 130;
                L.circleMarker([lat, lng], { color: '#00ff33', radius: 10 }).addTo(map);
                map.panTo([lat, lng]);
                logTerminal(`TARGET_LOCK: Sektor [${lat.toFixed(2)} | ${lng.toFixed(2)}]`, 'info');
            } else {
                logTerminal(`RADAR_PING: Signal reflektiert in Sub-Sektor ${Math.floor(Math.random()*900+100)}`, 'info');
            }
        }

        let alternativeMode = false;
        function toggleRadarMode() {
            alternativeMode = !alternativeMode;
            const radarElement = document.getElementById('offline-radar');
            
            if(map && tileLayer && document.getElementById('map').style.display !== 'none') {
                const container = tileLayer.getContainer();
                container.style.filter = alternativeMode 
                    ? "invert(1) hue-rotate(280deg) saturate(2) brightness(0.3) contrast(1.5)" 
                    : "invert(1) hue-rotate(80deg) saturate(2.5) brightness(0.4) contrast(1.5)";
            }
            
            if(alternativeMode) {
                radarElement.style.background = "radial-gradient(circle, rgba(40,0,0,1) 0%, rgba(0,0,0,1) 70%)";
                radarElement.style.color = "#ff0055";
                logTerminal("MODE_CHANGE: Infrarot-Frequenzband active.", 'danger');
            } else {
                radarElement.style.background = "radial-gradient(circle, rgba(0,35,0,1) 0%, rgba(0,0,0,1) 70%)";
                radarElement.style.color = "#00ff33";
                logTerminal("MODE_CHANGE: Standard-Matrix kalibriert.", 'info');
            }
        }

        function simulateCameraFeed() {
            logTerminal("Scanne öffentliche Kameras...", 'warn');
            setTimeout(() => {
                logTerminal("Gefunden: 3 offene Feeds (Verkehrsüberwachung).", 'info');
            }, 800);
        }
    </script>
</body>
</html>
