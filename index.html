<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NETWORK_CORE_INTERFACE_v7.0</title>
    
    <style>
        body {
            background-color: #010501;
            color: #00ff33;
            font-family: 'Courier New', Courier, monospace;
            margin: 0; padding: 10px;
            min-height: 100vh;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            text-shadow: 0 0 5px #00ff33;
            user-select: none;
            -webkit-user-select: none;
        }

        /* CRT Monitor Scanline-Effekt */
        body::before {
            content: " "; display: block;
            position: fixed; top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.2) 50%);
            z-index: 9999; background-size: 100% 4px; pointer-events: none;
        }

        header {
            border-bottom: 2px solid #00ff33;
            padding-bottom: 5px; margin-bottom: 10px;
            display: flex; justify-content: space-between;
            font-size: 0.8rem; font-weight: bold; flex-shrink: 0;
        }

        .container {
            display: flex; flex-direction: row; gap: 15px; flex-grow: 1;
        }

        @media (max-width: 768px) {
            .container { flex-direction: column; }
            .panel.left { min-height: 280px !important; height: 40%; }
            .panel.right { height: 380px !important; margin-bottom: 20px; }
        }

        .panel {
            border: 1px solid #00ff33;
            background: rgba(0, 8, 0, 0.7);
            padding: 10px;
            box-shadow: inset 0 0 15px rgba(0, 255, 51, 0.2);
            display: flex; flex-direction: column; box-sizing: border-box;
        }

        .panel.left { width: 100%; flex: 1; }
        .panel.right { width: 100%; flex: 2; position: relative; }

        .panel-title {
            font-weight: bold; text-transform: uppercase;
            border-bottom: 1px dashed #00ff33;
            padding-bottom: 3px; margin-bottom: 8px;
            font-size: 0.85rem; letter-spacing: 1px; flex-shrink: 0;
        }

        .button-group {
            display: grid; grid-template-columns: 1fr 1fr; gap: 8px; flex-shrink: 0;
        }

        button {
            background: #001500; color: #00ff33; border: 1px solid #00ff33;
            padding: 12px 5px; cursor: pointer;
            font-family: 'Courier New', monospace; font-weight: bold;
            font-size: 0.75rem; text-transform: uppercase;
            box-shadow: 0 0 2px #00ff33; transition: all 0.1s;
        }

        button:active { background: #00ff33; color: #000; }

        #terminal {
            flex-grow: 1; background: #000; padding: 8px;
            overflow-y: auto; font-size: 0.75rem;
            border: 1px solid #003300; margin-top: 10px; min-height: 100px;
        }

        /* Das High-Tech Radar & Display-Zentrum */
        #display-master {
            width: 100%; height: 100%; background: #000;
            position: relative; overflow: hidden; border: 1px solid #003300;
        }

        #radar-sweep {
            position: absolute; width: 200%; height: 200%;
            top: -50%; left: -50%;
            background: conic-gradient(from 0deg, rgba(0,255,51,0.15) 0deg, rgba(0,255,51,0) 90deg);
            transform-origin: center; animation: sweep 3.5s linear infinite;
            pointer-events: none; z-index: 3;
        }

        svg.vector-map {
            width: 100%; height: 100%; z-index: 2; position: absolute; top:0; left:0;
        }

        .map-land { fill: none; stroke: #00ff33; stroke-width: 1.5; opacity: 0.75; }
        .map-grid { fill: none; stroke: #001800; stroke-width: 0.5; }

        /* Integriertes Video-Fenster für Webcams */
        #webcam-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 4; background: #000; display: none;
            flex-direction: column;
        }

        #webcam-layer iframe {
            width: 100%; height: calc(100% - 30px); border: none;
            filter: invert(0.9) hue-rotate(90deg) contrast(1.3) brightness(0.7);
        }

        .cam-bar {
            background: #001500; height: 30px; display: flex;
            justify-content: space-between; align-items: center;
            padding: 0 10px; font-size: 0.75rem; font-weight: bold;
            border-bottom: 1px solid #00ff33;
        }

        @keyframes sweep {
            from { transform: rotate(0deg); } to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <header>
        <div>[SYSTEM: MAIN_FRAME_ONLINE] // VER_7.0</div>
        <div id="live-clock">0000-00-00 00:00:00</div>
    </header>

    <div class="container">
        <!-- LINKES KONTROLLZENTRUM -->
        <div class="panel left">
            <div class="panel-title">> INTERFACE_CONTROL</div>
            <div class="button-group">
                <button onclick="playHackerSound(520, 'sine', 0.08); triggerRadarScan();">SCAN SENSORS</button>
                <button onclick="playHackerSound(380, 'sawtooth', 0.12); fetchCountryStats();">LÄNDER STATS</button>
                <button onclick="playHackerSound(880, 'triangle', 0.05); toggleWebcam();">LIVE WEBCAM</button>
                <button onclick="playHackerSound(580, 'square', 0.1); closeWebcam();">RADAR MODE</button>
            </div>
            
            <div id="terminal">
                <div style="color: #00ff33;">[SYSTEM] Zentraler Systemkern v7.0 gestartet.</div>
                <div style="color: #00ff33;">[SYSTEM] Alle Sensor-Grids einsatzbereit.</div>
            </div>
        </div>

        <!-- RECHTES HAUPTDISPLAY -->
        <div class="panel right">
            <div class="panel-title">> VECTOR_RADAR_DISPLAY</div>
            <div id="display-master">
                
                <!-- Radar-Strahl -->
                <div id="radar-sweep"></div>
                
                <!-- Hacker-Videolayer für freie, legale Webcams -->
                <div id="webcam-layer">
                    <div class="cam-bar">
                        <span id="cam-title">LIVE_FEED // TOKIO_SHIBUYA</span>
                        <span style="color:#ff0055; cursor:pointer;" onclick="closeWebcam()">[X] CLOSE</span>
                    </div>
                    <iframe id="cam-frame" src=""></iframe>
                </div>
                
                <!-- Vektor-Weltkarte -->
                <svg class="vector-map" viewBox="0 0 1000 500">
                    <path class="map-grid" d="M0,100 L1000,100 M0,200 L1000,200 M0,300 L1000,300 M0,400 L1000,400 M100,0 L100,500 M200,0 L200,500 M300,0 L300,500 M400,0 L400,500 M500,0 L500,500 M600,0 L600,500 M700,0 L700,500 M800,0 L800,500 M900,0 L900,500" />
                    <!-- Konturen der Weltkarte -->
                    <path class="map-land" d="M150,80 L220,100 L250,150 L200,180 L260,230 L220,280 L240,320 L270,350 L250,450 L220,480 L200,420 L210,320 L160,270 L140,200 L110,140 L100,90 Z" />
                    <path class="map-land" d="M450,100 L550,70 L700,60 L850,90 L900,150 L800,200 L750,180 L650,220 L580,180 L520,140 L460,180 L440,250 L480,300 L550,330 L520,400 L480,450 L450,420 L400,350 L380,250 L420,200 L400,150 Z" />
                    <path class="map-land" d="M780,360 L840,350 L880,390 L850,440 L790,420 Z" />
                    <g id="radar-targets"></g>
                </svg>
            </div>
        </div>
    </div>

    <script>
        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }

        function playHackerSound(frequency, type = 'square', duration = 0.1) {
            initAudio(); if (!audioCtx) return;
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            oscillator.type = type; oscillator.frequency.setValueAtTime(frequency, audioCtx.currentTime);
            gainNode.gain.setValueAtTime(0.06, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);
            oscillator.connect(gainNode); gainNode.connect(audioCtx.destination);
            oscillator.start(); oscillator.stop(audioCtx.currentTime + duration);
        }

        setInterval(() => {
            document.getElementById('live-clock').innerText = new Date().toISOString().replace('T', ' ').substring(0, 19);
        }, 1000);

        function logTerminal(message, type = 'info') {
            const terminal = document.getElementById('terminal');
            const timestamp = new Date().toLocaleTimeString();
            let color = '#00ff33';
            if (type === 'warn') color = '#ffb000';
            if (type === 'danger') color = '#ff0055';
            terminal.innerHTML += `<div><span style="color: #444;">[${timestamp}]</span> <span style="color: ${color};">${message}</span></div>`;
            terminal.scrollTop = terminal.scrollHeight;
        }

        // 1. RADAR SCAN: Setzt ohne Ausnahmen Punkte auf den Schirm
        function triggerRadarScan() {
            logTerminal("Analysiere Satelliten-Datenströme...", "warn");
            const container = document.getElementById('radar-targets');
            container.innerHTML = '';
            for (let i = 0; i < 3; i++) {
                setTimeout(() => {
                    const rx = Math.floor(Math.random() * 650) + 180;
                    const ry = Math.floor(Math.random() * 250) + 100;
                    const circle = document.createElementNS("http://w3.org", "circle");
                    circle.setAttribute("cx", rx); circle.setAttribute("cy", ry); circle.setAttribute("r", "7");
                    circle.setAttribute("fill", "#00ff33");
                    const anim = document.createElementNS("http://w3.org", "animate");
                    anim.setAttribute("attributeName", "opacity"); anim.setAttribute("values", "1;0;1");
                    anim.setAttribute("dur", "0.8s"); anim.setAttribute("repeatCount", "indefinite");
                    circle.appendChild(anim); container.appendChild(circle);
                    logTerminal(`STATION_FOUND -> Koordinaten-Grid: [X:${rx} | Y:${ry}]`, "info");
                    playHackerSound(700, 'sine', 0.05);
                }, i * 400);
            }
        }

        // 2. LÄNDER STATS: Schnelle, direkt eingebaute Datenbank (Verhindert Internet-Blockaden komplett)
        const countryDB = [
            { name: "GERMANY", cap: "Berlin", pop: "83.200.000", status: "STABIL // KI-Core aktiv" },
            { name: "JAPAN", cap: "Tokio", pop: "125.100.000", status: "UPLINK_READY // High-Tech Netz" },
            { name: "ICELAND", cap: "Reykjavik", pop: "372.000", status: "SATELLITE_NODE // Kaltes Sektor-Grid" },
            { name: "USA", cap: "Washington D.C.", pop: "333.000.000", status: "OVERWATCH // Hohe Serverlast" },
            { name: "AUSTRALIA", cap: "Canberra", pop: "25.600.000", status: "DEEP_SPACE_LINK // Aktiv" }
        ];

        function fetchCountryStats() {
            const c = countryDB[Math.floor(Math.random() * countryDB.length)];
            logTerminal(`Frage globalen Datenbank-Knoten ab...`, "warn");
            setTimeout(() => {
                logTerminal(`UPLINK ERFOLGREICH: ${c.name}`, "info");
                logTerminal(`> Hauptknoten: ${c.cap}`);
                logTerminal(`> Daten-Bürger: ${c.pop}`);
                logTerminal(`> Netzwerk-Status: ${c.status}`, "warn");
                playHackerSound(600, 'triangle', 0.15);
            }, 300);
        }

        // 3. ECHTE LIVE WEBCAMS (Öffentliche, freie Einbettungen)
        const camFeeds = [
            { title: "LIVE_FEED // TOKIO_SHIBUYA", url: "https://youtube-nocookie.com" },
            { title: "LIVE_FEED // NEW_YORK_TIMES_SQUARE", url: "https://youtube-nocookie.com" }
        ];
        let currentCamIndex = 0;

        function toggleWebcam() {
            const layer = document.getElementById('webcam-layer');
            const frame = document.getElementById('cam-frame');
            const title = document.getElementById('cam-title');
            const feed = camFeeds[currentCamIndex];
            
            title.innerText = feed.title;
            frame.src = feed.url;
            layer.style.display = 'flex';
            
            logTerminal(`Verbinde Video-Matrix: ${feed.title}`, "info");
            currentCamIndex = (currentCamIndex + 1) % camFeeds.length;
        }

        function closeWebcam() {
            document.getElementById('webcam-layer').style.display = 'none';
            document.getElementById('cam-frame').src = "";
            logTerminal("Video-Matrix getrennt. Re-aktiviere Satelliten-Radar.", "info");
        }
    </script>
</body>
</html>
