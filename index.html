<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OVERWATCH_SYSTEM_v12.0</title>
    <style>
        body { background:#010501; color:#00ff33; font-family:'Courier New',monospace; margin:0; padding:10px; height:100vh; box-sizing:border-box; display:flex; flex-direction:column; overflow:hidden; text-shadow:0 0 5px #00ff33; user-select:none; -webkit-user-select:none; }
        body::before { content:" "; display:block; position:fixed; top:0; left:0; bottom:0; right:0; background:linear-gradient(rgba(18,16,16,0) 50%, rgba(0,0,0,0.2) 50%); z-index:9999; background-size:100% 4px; pointer-events:none; }
        header { border-bottom:2px solid #00ff33; padding-bottom:5px; margin-bottom:10px; display:flex; justify-content:space-between; font-size:0.8rem; font-weight:bold; flex-shrink:0; }
        .container { display:flex; gap:15px; flex-grow:1; height:calc(100vh - 50px); }
        @media (max-width:768px) { .container { flex-direction:column; overflow-y:auto; } .panel.left { height:340px !important; flex-shrink:0; } .panel.right { height:320px !important; flex-shrink:0; margin-bottom:25px; } }
        .panel { border:1px solid #00ff33; background:rgba(0,8,0,0.7); padding:10px; box-shadow:inset 0 0 15px rgba(0,255,51,0.2); display:flex; flex-direction:column; box-sizing:border-box; }
        .panel.left { width:100%; flex:1.2; } .panel.right { width:100%; flex:1.5; position:relative; }
        .panel-title { font-weight:bold; text-transform:uppercase; border-bottom:1px dashed #00ff33; padding-bottom:3px; margin-bottom:8px; font-size:0.85rem; letter-spacing:1px; }
        .button-group { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
        button { background:#001500; color:#00ff33; border:1px solid #00ff33; padding:12px 5px; cursor:pointer; font-family:'Courier New',monospace; font-weight:bold; font-size:0.75rem; text-transform:uppercase; }
        button:active { background:#00ff33; color:#000; }
        #terminal { flex-grow:1; background:#000; padding:8px; overflow-y:scroll; font-size:0.75rem; border:1px solid #003300; margin-top:10px; height:140px; box-sizing:border-box; }
        #terminal::-webkit-scrollbar { width:4px; } #terminal::-webkit-scrollbar-thumb { background:#004400; }
        #terminal-input-container { display:none; margin-top:5px; gap:5px; }
        #cmd-input { background:#000; color:#00ff33; border:1px solid #00ff33; padding:5px; font-family:'Courier New',monospace; font-size:0.8rem; flex-grow:1; outline:none; }
        #display-master { width:100%; height:100%; background:#000; position:relative; overflow:hidden; border:1px solid #003300; }
        #radar-sweep { position:absolute; width:200%; height:200%; top:-50%; left:-50%; background:conic-gradient(from 0deg, rgba(0,255,51,0.15) 0deg, rgba(0,255,51,0) 90deg); transform-origin:center; animation:sweep 3.5s linear infinite; pointer-events:none; z-index:3; }
        svg.vector-map { width:100%; height:100%; z-index:2; position:absolute; top:0; left:0; }
        .map-land { fill:none; stroke:#00ff33; stroke-width:1.5; opacity:0.75; }
        .map-grid { fill:none; stroke:#001800; stroke-width:0.5; }
        #search-layer { position:absolute; top:0; left:0; width:100%; height:100%; z-index:5; background:rgba(0,5,0,0.95); display:none; flex-direction:column; padding:15px; box-sizing:border-box; }
        #search-input { background:#000; color:#00ff33; border:1px solid #00ff33; padding:10px; font-family:'Courier New',monospace; font-size:1rem; width:100%; box-sizing:border-box; outline:none; text-transform:uppercase; }
        #search-results { margin-top:15px; overflow-y:auto; flex-grow:1; border:1px dashed #004400; padding:5px; }
        .search-item { padding:8px; border-bottom:1px solid #002200; cursor:pointer; font-size:0.85rem; }
        
        /* REINES STREAM-FENSTER: Absolut Klickgeschützt! */
        #stream-window { position:absolute; top:0; left:0; width:100%; height:100%; background:#000; z-index:6; display:none; flex-direction:column; }
        /* pointer-events: none sorgt dafür, dass man das Video NICHT anklicken kann! */
        #video-player { width:100%; height:calc(100% - 30px); background:#000; border:none; pointer-events:none; filter:hue-rotate(60deg) contrast(1.4) brightness(0.8); }
        .layer-bar { background:#001500; height:30px; display:flex; justify-content:space-between; align-items:center; padding:0 10px; font-size:0.75rem; font-weight:bold; border-bottom:1px solid #00ff33; }
        @keyframes sweep { from { transform:rotate(0deg); } to { transform:rotate(360deg); } }
    </style>
</head>
<body>
    <header>
        <div>[SYSTEM: OPERATIONAL_GRID] // VER_12.0_CLEAN</div>
        <div id="live-clock">0000-00-00 00:00:00</div>
    </header>
    <div class="container">
        <!-- LINKES KONTROLLZENTRUM -->
        <div class="panel left">
            <div class="panel-title">> INTERFACE_CONTROL</div>
            <div class="button-group">
                <button onclick="triggerLiveRadarScan()">SCAN SENSORS</button>
                <button onclick="openSearchLayer()">LÄNDER STATS</button>
                <button onclick="printWebcamMenu()">LIVE WEBCAM</button>
                <button onclick="closeAllLayers()">CLEAR PANEL</button>
            </div>
            <div id="terminal">
                <div style="color:#00ff33;">[SYSTEM] System v12.0 unblockierbar kalibriert.</div>
                <div style="color:#00ff33;">[SYSTEM] Reine Server-Feeds aktiv. YouTube restlos entfernt.</div>
            </div>
            <div id="terminal-input-container">
                <span style="color:#00ff33; font-size:0.8rem; font-weight:bold;">CMD></span>
                <input type="text" id="cmd-input" placeholder="ID eingeben und Enter drücken..." onkeypress="handleTerminalInput(event)">
            </div>
        </div>
        
        <!-- RECHTES HAUPTDISPLAY -->
        <div class="panel right">
            <div class="panel-title">> VISUAL_CORE_DISPLAY</div>
            <div id="display-master">
                <div id="radar-sweep"></div>
                <div id="search-layer">
                    <div class="layer-bar" style="margin-bottom:10px;">
                        <span>DATABASE_SEARCH</span>
                        <span style="color:#ff0055; font-weight:bold; cursor:pointer;" onclick="closeAllLayers()">[X] CLOSE</span>
                    </div>
                    <input type="text" id="search-input" placeholder="Land eingeben (z.B. Kroatien, Island)..." oninput="filterCountries()">
                    <div id="search-results"></div>
                </div>
                
                <!-- Reines Videofenster: Lädt klicksicheres HTML5-Video anstelle von YouTube -->
                <div id="stream-window">
                    <div class="layer-bar">
                        <span id="stream-title">TUNNEL_LINK</span>
                        <span style="color:#ff0055; font-weight:bold; cursor:pointer;" onclick="closeStreamWindow()">[X] CLOSE</span>
                    </div>
                    <video id="video-player" autoplay loop muted playsinline></video>
                </div>
                
                <svg class="vector-map" viewBox="0 0 1000 500">
                    <path class="map-grid" d="M0,100 L1000,100 M0,200 L1000,200 M0,300 L1000,300 M0,400 L1000,400 M100,0 L100,500 M200,0 L200,500 M300,0 L300,500 M400,0 L400,500 M500,0 L500,500" />
                    <path class="map-land" d="M150,80 L220,100 L250,150 L200,180 L260,230 L220,280 L250,450 L200,420 M450,100 L550,70 L700,60 L850,90 L900,150 L800,200 L650,220 L520,140 L440,250 L480,300 L520,400 L400,350 Z" />
                    <g id="radar-targets"></g>
                </svg>
            </div>
        </div>
    </div>
    <script>
        let audioCtx = null;
        function playHackerSound(f, t='square', d=0.1) {
            try {
                if(!audioCtx) audioCtx = new(window.AudioContext || window.webkitAudioContext)();
                let o = audioCtx.createOscillator(), g = audioCtx.createGain();
                o.type = t; o.frequency.setValueAtTime(f, audioCtx.currentTime);
                g.gain.setValueAtTime(0.05, audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + d);
                o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime + d);
            } catch(e){}
        }
        setInterval(() => { document.getElementById('live-clock').innerText = new Date().toISOString().replace('T', ' ').substring(0, 19); }, 1000);
        function logTerminal(m, type='info') {
            const t = document.getElementById('terminal');
            let c = '#00ff33'; if(type==='warn') c='#ffb000'; if(type==='danger') c='#ff0055';
            t.innerHTML += `<div><span style="color:#444;">[${new Date().toLocaleTimeString()}]</span> <span style="color:${c};">${m}</span></div>`;
            t.scrollTop = t.scrollHeight;
        }

        // ABSOLUT REINE SERVER-STREAMS (.mp4/.m3u8): Keine Webseiten, kein YouTube, klicksicher!
        const webcamDatabase = [
            { id: 1, name: "ORBITAL_NODE (Satelliten-Feed)", url: "https://googleapis.com" },
            { id: 2, name: "TOKIO (Knotenpunkt-Matrix)", url: "https://googleapis.com" },
            { id: 3, name: "ZAGREB (Uplink-Sektor)", url: "https://googleapis.com" }
        ];

        function printWebcamMenu() {
            closeAllLayers(); playHackerSound(440);
            document.getElementById('terminal-input-container').style.display = 'flex';
            logTerminal("======= [ LIVE CAM DIRECTORY ] =======", "warn");
            webcamDatabase.forEach(cam => { logTerminal(` ID [ ${cam.id} ] -> CONNECT: ${cam.name}`, "info"); });
            logTerminal("CMD: Tippe ID unten ein & drücke Enter.", "warn");
            document.getElementById('cmd-input').focus();
        }
        function handleTerminalInput(e) {
            if (e.key === 'Enter') {
                const val = parseInt(document.getElementById('cmd-input').value.trim());
                const cam = webcamDatabase.find(c => c.id === val);
                if (cam) {
                    playHackerSound(800); logTerminal(`Verbinde Server-Uplink [${val}]...`, "warn");
                    buildStreamTunnel(cam.name, cam.url);
                    document.getElementById('cmd-input').value = "";
                } else {
                    playHackerSound(150, 'sawtooth'); logTerminal(`FAIL: ID [${val}] ungültig.`, "danger");
                }
            }
        }
        function triggerLiveRadarScan() {
            closeAllLayers(); playHackerSound(600, 'sine');
            logTerminal("Starte orbitalen Port-Scan... Abfangen von Subnetzen.", "warn");
            setTimeout(() => {
                const rx = Math.floor(Math.random() * 600) + 150, ry = Math.floor(Math.random() * 200) + 100;
                const circle = document.createElementNS("http://w3.org", "circle");
                circle.setAttribute("cx", rx); circle.setAttribute("cy", ry); circle.setAttribute("r", "10"); circle.setAttribute("fill", "none"); circle.setAttribute("stroke", "#ff0055"); circle.setAttribute("stroke-width", "2");
                document.getElementById('radar-targets').appendChild(circle);
                const cam = webcamDatabase[Math.floor(Math.random() * webcamDatabase.length)];
                logTerminal(`[UPLINK HIT!!] Reiner Server-Stream abgefangen -> ${cam.name}`, "danger");
                buildStreamTunnel(cam.name, cam.url);
            }, 1000);
        }
        function buildStreamTunnel(title, url) {
            document.getElementById('stream-window').style.display = 'flex';
            const player = document.getElementById('video-player');
            player.src = url; player.play();
            document.getElementById('stream-title').innerText = `LINK // ${title.toUpperCase()}`;
        }
        function closeStreamWindow() {
            document.getElementById('stream-window').style.display = 'none';
            const player = document.getElementById('video-player');
            player.pause(); player.src = "";
            logTerminal("Tunnel geschlossen.", "info");
        }
        function openSearchLayer() { closeAllLayers(); playHackerSound(440); document.getElementById('search-layer').style.display = 'flex'; document.getElementById('search-input').focus(); }
        
        // 🟢 ECHTE LIVE INTERNET-ABFRAGE ÜBER DIE WELT-DATENBANK (Ungeschmuggelt & live)
        function filterCountries() {
            const q = document.getElementById('search-input').value.trim();
            const r = document.getElementById('search-results'); r.innerHTML = '';
            if(q.length < 2) { r.innerHTML = '<div style="color:#444;padding:10px;">Mindestens 2 Buchstaben tippen...</div>'; return; }
            
            // Holt die echten, aktuellen Daten über jedes Land live aus dem Internet!
            fetch(`https://restcountries.com{q}?fields=name,capital,population,languages,currencies,cca2`)
                .then(res => { if(!res.ok) throw new Error(); return res.json(); })
                .then(data => {
                    data.slice(0, 5).forEach(c => {
                        const d = document.createElement('div'); d.className = 'search-item'; d.innerText = `> NODE: ${c.name.common.toUpperCase()} [${c.cca2}]`;
                        d.onclick = () => {
                            const cap = c.capital ? c.capital[0] : 'Keine';
                            const pop = c.population.toLocaleString();
                            const lang = Object.values(c.languages).join(', ');
                            const cur = Object.values(c.currencies).map(val => val.name).join(', ');
                            logTerminal(`=[${c.cca2}]= Head: ${cap} | Pop: ${pop} | Lang: ${lang} | Cur: ${cur}`, "warn");
                            closeAllLayers();
                        };
                        r.appendChild(d);
                    });
                })
                .catch(() => { r.innerHTML = '<div style="color:#ff0055;padding:10px;">KEINE KNOTEN IM NETZWERK GEFOUNDEN.</div>'; });
        }
        function closeAllLayers() { document.getElementById('search-layer').style.display='none'; document.getElementById('terminal-input-container').style.display='none'; document.getElementById('search-input').value=""; document.getElementById('cmd-input').value=""; }
    </script>
</body>
</html>
